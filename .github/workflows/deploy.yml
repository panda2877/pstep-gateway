# ============================================================================
# Pstep Gateway — 自动部署工作流（前后端 + 容器化镜像）
#
# 触发方式：
#   1. push 到 main 分支（src/frontend/Cargo/Containerfile/quadlet 等）
#   2. 手动触发 (workflow_dispatch)
#
# 设计：
#   - 后端构建为 Podman Quadlet 镜像；前端仍由主机 nginx 静态托管
#   - 部署走 **scp 直传**（避免从中国拉 GHCR 速度问题）；服务器 `podman load`
#   - 同时把镜像 **推一份到 GHCR** 作为异地备份（全量保留，不做清理）
#   - 服务器本地保留最近 5 个镜像版本，便于快速回滚
#   - gateway 构建内联到 deploy job，避免 10 MB artifact 下载的 GH Actions
#     偶发失败问题。frontend 仍并行构建（artifact 仅 90 KB，稳定）
# ============================================================================

name: 🚀 Deploy Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'Containerfile'
      - '.containerignore'
      - 'quadlet/**'
      - 'nginx/**'
      - '.github/workflows/deploy.yml'

jobs:
  # ==========================================================================
  # 1. 前端构建：dist 由主机 nginx 静态托管（并行执行）
  # ==========================================================================
  build-admin:
    name: 🎨 Build Admin Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - working-directory: ./frontend
        run: npm ci

      - working-directory: ./frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/dist
          retention-days: 3

  # ==========================================================================
  # 2. 构建镜像 → scp 直传 + 推 GHCR 备份 → 远程 restart
  # ==========================================================================
  deploy:
    name: 🚀 Build Gateway & Deploy
    needs: [build-admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 推送备份需要
    steps:
      - uses: actions/checkout@v6

      - name: Download admin dist artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./artifacts/admin-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (for backup push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build gateway image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false       # 不直推；通过本地 load → save + push 两路分发
          load: true        # 加载到 runner 的 docker daemon，供下面 save / push 用
          tags: pstep-gateway:${{ github.sha }}
          # Explicit per-commit cache key. Without a key, GHA auto-generates one
          # and reuses the same cache across commits, which caused a serious
          # regression: a previous build's binary (b346c535cb5f) was shipped
          # tagged with a later commit's SHA. The per-commit key ensures
          # cargo's build layer can never be reused across commits.
          cache-from: type=gha,key=buildx-${{ github.sha }}
          cache-to: type=gha,mode=max,key=buildx-${{ github.sha }}

      - name: Verify image built
        run: |
          docker images pstep-gateway:${{ github.sha }} --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.ID}}"

      - name: Push image to GHCR (off-site backup, full retention)
        run: |
          docker tag pstep-gateway:${{ github.sha }} \
                     ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }}
          docker tag pstep-gateway:${{ github.sha }} \
                     ghcr.io/${{ github.repository_owner }}/pstep-gateway:latest
          docker push ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/pstep-gateway:latest
          echo "✅ GHCR backup pushed (无清理；全量保留)"

      - name: Deploy via SSH
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -euo pipefail

          # ---- 配置 SSH ----
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSHD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"
          SSHCMD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key"
          # 注：scp 在 GHA runner 上行为不可信（静默丢包 / CRC 错），下面所有上传
          # 改用 cat | ssh 'cat > remote' 管道 + docker save | ssh 管道。

          # ---- 1. 推送所有小文件（admin dist / Quadlet / nginx）----
          # 把 admin dist + Quadlet + nginx 站点合并成单一 tarball，
          # 通过单条 ssh 管道推到远端 /tmp。一次 ssh = 一次失败点。
          #
          # 之前分两步走「bundle 推送 → 切换 dist → setup dirs」踩坑了：
          # 第一个 ssh session 把 staging 里的文件 cp 到 /tmp/ 后，第二个
          # ssh session 看不到这些 cp 出来的文件 —— 不是权限问题，
          # 看着像某些情况下 GHA runner 上的 sudo cp 会沉默丢文件。
          # 现在把全部事情（收 tarball、extract、校验、切换 dist、
          # install Quadlet/install nginx/setup dirs/daemon-reload）
          # 全塞进一个 ssh session。一次推到位，无中间 cp 落地。
          echo "📦 合并打包 + 推送 + 一次性部署（admin dist + Quadlet + nginx）..."

          tar -czf /tmp/deploy-payload.tgz \
            -C "$GITHUB_WORKSPACE/artifacts" admin-dist \
            -C "$GITHUB_WORKSPACE/quadlet" pstep-gateway-a.container \
            -C "$GITHUB_WORKSPACE/quadlet" pstep-gateway-b.container \
            -C "$GITHUB_WORKSPACE/nginx/sites-available" pstep-gateway

          cat /tmp/deploy-payload.tgz | \
            $SSHCMD ${SERVER_USER}@${SERVER_HOST} '
              set -e

              # ---- 1.1 收 tarball + 解到 staging ----
              cat > /tmp/deploy-payload.tgz
              sudo rm -rf /tmp/deploy-staging
              sudo mkdir -p /tmp/deploy-staging
              sudo tar -xzf /tmp/deploy-payload.tgz -C /tmp/deploy-staging
              echo "---- 远端解包后文件 ----"
              sudo find /tmp/deploy-staging -type f -exec ls -la {} +

              # 必到齐 + 非空（任何缺失立刻 set -e 触发失败）
              for f in \
                /tmp/deploy-staging/admin-dist/index.html \
                /tmp/deploy-staging/pstep-gateway-a.container \
                /tmp/deploy-staging/pstep-gateway-b.container \
                /tmp/deploy-staging/pstep-gateway; do
                if [ ! -s "$f" ]; then
                  echo "❌ 缺失或空文件: $f"
                  exit 1
                fi
              done

              # ---- 1.2 切换 admin dist（旧 → new，原子）----
              sudo rm -rf /opt/pstep/admin/dist.old
              if [ -d /opt/pstep/admin/dist ]; then
                sudo mv /opt/pstep/admin/dist /opt/pstep/admin/dist.old
              fi
              sudo mv /tmp/deploy-staging/admin-dist /opt/pstep/admin/dist
              sudo rm -rf /opt/pstep/admin/dist.old

              # ---- 1.3 install Quadlet 单元 ----
              sudo mkdir -p /etc/containers/systemd/pstep
              sudo install -m 0644 /tmp/deploy-staging/pstep-gateway-a.container \
                /etc/containers/systemd/pstep/pstep-gateway-a.container
              sudo install -m 0644 /tmp/deploy-staging/pstep-gateway-b.container \
                /etc/containers/systemd/pstep/pstep-gateway-b.container
              sudo systemctl daemon-reload

              # ---- 1.4 install nginx 站点（首次启用 + 后续覆盖源文件）----
              sudo install -m 0644 /tmp/deploy-staging/pstep-gateway \
                /etc/nginx/sites-available/pstep-gateway
              if [ ! -e /etc/nginx/sites-enabled/pstep-gateway ]; then
                sudo ln -sf /etc/nginx/sites-available/pstep-gateway \
                            /etc/nginx/sites-enabled/pstep-gateway
                # 首次启用：nginx -t 预检，reload 切流
                sudo nginx -t
                sudo systemctl reload nginx
                echo "✅ nginx pstep-gateway 站点首次启用"
              fi

              # ---- 1.5 准备运行时目录 ----
              # config.yaml 需世界可读（distroless 以 UID 65532 运行，无 /etc/passwd 项）
              # /var/lib/pstep-gateway-{a,b} 需 chown 65532 让 usage_db 能写
              if [ -f /etc/pstep-gateway/config.yaml ]; then
                sudo chmod 644 /etc/pstep-gateway/config.yaml
              fi
              sudo mkdir -p /var/lib/pstep-gateway-a /var/lib/pstep-gateway-b
              sudo chown 65532:65532 /var/lib/pstep-gateway-a /var/lib/pstep-gateway-b
              sudo chmod 755 /var/lib/pstep-gateway-a /var/lib/pstep-gateway-b

              # ---- 1.6 迁移期：停掉老的单实例 pstep-gateway.service ----
              if sudo systemctl is-active --quiet pstep-gateway.service 2>/dev/null; then
                echo "🔁 检测到旧 pstep-gateway.service 在跑，迁移到蓝绿..."
                sudo systemctl stop pstep-gateway.service || true
                sudo systemctl disable pstep-gateway.service 2>/dev/null || true
                sudo podman rm -f pstep-gateway 2>/dev/null || true
                echo "✅ 旧单实例已停"
              fi

              # ---- 1.7 清 staging ----
              sudo rm -rf /tmp/deploy-staging /tmp/deploy-payload.tgz
              echo "✅ 小文件部署 + Quadlet install + nginx install + dirs setup 全部完成"
            '
          rm -f /tmp/deploy-payload.tgz

          # ---- 2.5 (旧) 准备运行时目录 ----
          # 上面的 ssh session 已经做完这件事；保留这段只是占位，不再发 ssh。
          echo "🔧 准备运行时目录（已在上一步完成，跳过）"

          # ---- 3. 远端从 GHCR 拉镜像 ----
          # 不再用 docker save | gzip | ssh 管道直传 gateway 镜像了。
          # 这个 GHA runner 类型下的 ssh/scp/管道直传有系统性不可靠（管
          # 道半路丢字节 / scp CRC 错 / scp 沉默 0 字节）—— 连续 6 次
          # deploy 都挂在「镜像从 runner 传到远端」这一步。
          #
          # 既然构建步骤已经 `docker push` 到 ghcr.io/panda2877/pstep-gateway
          # （公开仓库），远端直接 `podman pull` 即可：
          #   - 走 HTTPS，由 container registry 内置的 layer checksum 校验
          #   - 失败有明确 HTTP 状态码，不会出现「沉默丢字节」
          #   - 镜像一次性到位，不需要先 load 再 tag（pull 自动用 :SHA tag）
          #   - 走完后我们再 tag 成 :latest 覆盖悬空 ID
          IMAGE="ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }}"
          echo "🐳 远端从 GHCR 拉镜像: $IMAGE..."
          $SSHD "
            set -e
            echo '---- pull 前 registry 已有镜像 ----'
            sudo podman images --format 'table {{.Repository}}:{{.Tag}}\t{{.ID}}' \\
              | grep 'pstep-gateway' || echo '(none)'
            sudo podman pull '$IMAGE'
            sudo podman tag '$IMAGE' pstep-gateway:latest
            echo '---- pull 后 ----'
            sudo podman images --format 'table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}' \\
              | grep 'pstep-gateway'
            echo '✅ 镜像已 load + tag 为 latest'
          "

          # ---- 4. 服务器端：load 镜像 + 蓝绿切流 + 健康检查 ----
          # 蓝绿流程：
          #  1. 加载新镜像
          #  2. 找到当前 nginx upstream 指向哪个端口（13004=A / 13005=B）
          #  3. 把 *新* systemd unit (slot 对调) enable + start
          #  4. 等备用 slot 跑起来
          #  5. sed 改 nginx upstream 指向新 slot，nginx -s reload
          #  6. 停掉旧 slot（drain 由 Phase 1 的 SIGTERM handler 处理）
          #  7. 镜像保留 5 个版本
          $SSHD '
            set -e

            # 镜像已由上面 docker save | gzip | ssh 管道 load + tag 完毕。
            # 这里直接进入蓝绿切流流程。

            NGINX_CONF=/etc/nginx/sites-enabled/pstep-gateway
            # slot A 暴露 127.0.0.1:13004，slot B 暴露 127.0.0.1:13005。
            # 解析 nginx upstream 当前指向哪个端口（匹配带 "# ACTIVE" 标记的那一行；
            # 双 upstream 设计下两行 server 同时存在，必须靠注释定位 active）。
            ACTIVE_PORT=$(sudo grep -E "127\.0\.0\.1:(13004|13005).*# ACTIVE" "$NGINX_CONF" | head -1 | grep -oE "127\.0\.0\.1:(13004|13005)" | cut -d: -f2)
            if [ -z "$ACTIVE_PORT" ]; then
              echo "❌ 无法从 $NGINX_CONF 解析当前 active 端口（找不到带 # ACTIVE 标记的行），退出"
              exit 1
            fi
            echo "🔍 当前 active 端口: $ACTIVE_PORT"

            if [ "$ACTIVE_PORT" = "13004" ]; then
              STANDBY_PORT=13005
              STANDBY_UNIT=pstep-gateway-b.service
              STANDBY_CONTAINER=pstep-gateway-b
              OLD_UNIT=pstep-gateway-a.service
              OLD_CONTAINER=pstep-gateway-a
            else
              STANDBY_PORT=13004
              STANDBY_UNIT=pstep-gateway-a.service
              STANDBY_CONTAINER=pstep-gateway-a
              OLD_UNIT=pstep-gateway-b.service
              OLD_CONTAINER=pstep-gateway-b
            fi
            echo "🎯 新 active 将切到 $STANDBY_PORT ($STANDBY_UNIT)"

            # ---- 4.1 启动备用 slot ----
            # Quadlet 单元是 generated/transient，不能 enable，只能 start。
            # 之前用 `enable --now || true` 掩盖了失败，这次不用 || true：
            # 启动失败直接 exit 1，让 CI 红。
            echo "🚀 启动备用 slot $STANDBY_UNIT..."
            if ! sudo systemctl start "$STANDBY_UNIT"; then
              echo "❌ systemctl start 失败"
              sudo systemctl status "$STANDBY_UNIT" --no-pager -n 20 || true
              sudo journalctl -u "$STANDBY_UNIT" --no-pager -n 40 || true
              exit 1
            fi

            # ---- 4.2 等备用 slot 起来（健康）----
            # 用 /v1/models 而非 /health 作为 probe —— 134.175.163.213 上
            # 3003 是 nginx pstep-admin 站点（serve 前端 dist），它对 /health
            # 也会 200；但 /v1/models 是 OpenAI 兼容路径，只有 gateway 容器
            # 才有，没有可被误判的 fallback。同时也证明容器内 /health 真的
            # 起来了（响应里有 uptime/version/model list）。
            echo "🏥 等备用 slot healthy..."
            # 用 jq 解析响应 JSON 的 .object 字段 === "list"。
            #
            # 关键陷阱：deploy.yml 用 $SSHD '\''...'\'' single-quoted 块把脚本传给
            # 远端 bash。块里写 jq -e '\''...'\'' 含单引号会被截断。解法：
            # 先把 jq filter 写入 server 上的 /tmp 文件，jq -f 读。
            #
            # 用法：scp filter 上来 → /tmp/jq_filter → server 用 jq -f 读。
            # 但我们不 scp（避免改 deploy.yml 流程），改用 base64 注入：
            JQ_B64="Lm9iamVjdCA9PSAibGlzdCI="   # base64('.object == "list"')
            echo "$JQ_B64" | sudo tee /tmp/jq_filter.b64 >/dev/null
            sudo base64 -d /tmp/jq_filter.b64 > /tmp/jq_filter
            sudo cat /tmp/jq_filter || true
            healthy=false
            for i in $(seq 1 20); do
              # 先看端口是否在 listen（比 HTTP probe 快；publish 重启期端口瞬断）
              if ! sudo ss -tln 2>/dev/null | grep -q "127.0.0.1:$STANDBY_PORT\b"; then
                echo "⏳ attempt $i: port $STANDBY_PORT 暂未监听"
                sleep 1
                continue
              fi
              # 端口在；HTTP probe。-m 2 严格超时。
              # ⚠️ 不能用 `resp=$(curl ...)` 单独一行 —— curl 失败时 set -e 会
              # 直接杀掉脚本（bypass `rc=$?`）。必须用 `|| true` 抑制。
              resp=$(curl -sf -m 2 "http://127.0.0.1:$STANDBY_PORT/v1/models" 2>&1) || true
              rc=$?
              echo "⏳ attempt $i: curl rc=$rc resp_len=${#resp}"
              # 用 -f 读 filter 文件，避免命令行传 filter 时嵌套引号问题
              if [ $rc -eq 0 ] && echo "$resp" | sudo jq -ef /tmp/jq_filter >/tmp/jq_out 2>&1; then
                echo "✅ Standby healthy (attempt $i, port $STANDBY_PORT, hit gateway container)"
                healthy=true
                break
              fi
              if [ $rc -eq 0 ]; then
                echo "    jq failed, output: $(cat /tmp/jq_out 2>/dev/null | head -c 200)"
                echo "    resp: $(echo "$resp" | head -c 200)"
              fi
              sleep 1
            done
            if [ "$healthy" != "true" ]; then
              echo "❌ Standby slot $STANDBY_PORT 起来失败（健康检查被误判或容器未启动）"
              echo "---- journalctl tail ($STANDBY_UNIT) ----"
              sudo journalctl -u "$STANDBY_UNIT" --no-pager -n 60 || true
              echo "---- port $STANDBY_PORT 监听状态 ----"
              sudo ss -tlnp | grep ":$STANDBY_PORT " || echo "无"
              exit 1
            fi

            # ---- 4.3 切 nginx upstream ----
            # 双 upstream 设计：两行 server 同时存在（互备 failover 用），每次切流
            # 是 **ACTIVE 和 STANDBY 角色互换** —— 不是只把 ACTIVE 行改成 standby port。
            # 否则切流一次后两行 server 都指向同一 port，退化回单 slot。
            #
            # 用 python 做行级 swap。脚本通过 base64 注入 /tmp（避免 heredoc 在
            # $SSHD single-quoted 块里被 YAML 块字符串规则误判）。
            echo "🔀 切 nginx upstream：ACTIVE $ACTIVE_PORT ↔ STANDBY $STANDBY_PORT..."
            SWAP_B64=""
            echo "$SWAP_B64" | sudo tee /tmp/swap-upstream.py.b64 >/dev/null
            sudo base64 -d /tmp/swap-upstream.py.b64 > /tmp/swap-upstream.py
            sudo chmod +x /tmp/swap-upstream.py
            sudo /tmp/swap-upstream.py "$NGINX_CONF" "$ACTIVE_PORT" "$STANDBY_PORT"
            sudo nginx -t
            sudo nginx -s reload

            # ---- 4.4 给 keepalive 连接 3s 老化 ----
            echo "⏳ 等 3s 让旧连接走完..."
            sleep 3

            # ---- 4.5 restart 旧 active slot，让它升到 :latest（双 slot 互备必须保留两边）----
            # 不能 stop：双 upstream 设计下 nginx 仍指向另一 slot，但旧 slot 占着 1300X 端口、
            # 万一另一 slot 死了就没有 failover 兜底。改成 restart：SIGTERM drain in-flight，
            # 再 systemctl start 起来跑 :latest。restart 完确认端口重新 listen 才继续。
            echo "🔄 restart 旧 active slot $OLD_UNIT，让它升到 :latest（双 slot 互备保留两边）..."
            sudo systemctl restart "$OLD_UNIT"
            for i in $(seq 1 15); do
              if sudo ss -tln 2>/dev/null | grep -q "127.0.0.1:$ACTIVE_PORT\b"; then
                echo "✅ 旧 active slot $OLD_UNIT 已重新起来（attempt $i）"
                break
              fi
              sleep 1
            done
            if ! sudo ss -tln 2>/dev/null | grep -q "127.0.0.1:$ACTIVE_PORT\b"; then
              echo "❌ 旧 active slot $OLD_UNIT restart 后端口 $ACTIVE_PORT 仍未监听"
              sudo journalctl -u "$OLD_UNIT" --no-pager -n 40 || true
              exit 1
            fi

            # ---- 4.6 公网端到端验证 ----
            echo "🌐 公网健康检查..."
            if ! curl -sf http://127.0.0.1:3002/health > /dev/null; then
              echo "❌ 公网 3002 健康检查失败"
              echo "---- nginx error log ----"
              sudo tail -20 /var/log/nginx/pstep-gateway.error.log || true
              exit 1
            fi
            echo "✅ Gateway 公网 3002 OK"

            # 双 slot 互备：必须两个端口都健康，否则下一次 deploy 之前没有 failover 兜底
            if ! curl -sf -m 2 http://127.0.0.1:13004/health > /dev/null; then
              echo "❌ Slot A (13004) 健康检查失败（双 slot 互备要求两边都活）"
              exit 1
            fi
            echo "✅ Slot A (13004) OK"
            if ! curl -sf -m 2 http://127.0.0.1:13005/health > /dev/null; then
              echo "❌ Slot B (13005) 健康检查失败（双 slot 互备要求两边都活）"
              exit 1
            fi
            echo "✅ Slot B (13005) OK"

            if ! curl -sf http://127.0.0.1:3003/ > /dev/null; then
              echo "❌ Frontend check failed"
              exit 1
            fi
            echo "✅ Frontend reachable"

            # ---- 5. 镜像保留策略：保留最近 5 个版本（pstep-gateway:latest 必须保留）----
            # 坑：若 pstep-gateway:latest 跟某个旧 SHA 标签指向同一 image ID，
            # grep -v ":latest" 只排除那一行，但 awk 抽出的 ID 仍会传给 podman rmi -f
            # 把整个 ID 删了 → latest 标签变 dangling → slot 启动报
            # "short-name did not resolve to an alias"。
            # 修复：先记下 latest 指向的 ID，cleanup 时跳过该 ID。
            echo "🧹 清理旧镜像（保留最近 5 个 + pstep-gateway:latest 指向的 ID）..."
            KEEP=5
            LATEST_ID=$(sudo podman images --format "{{.ID}}" | head -1)  # tag latest 永远最先
            sudo podman images --format "{{.ID}} {{.CreatedAt}} {{.Repository}}:{{.Tag}}" \
              | grep "pstep-gateway" \
              | grep -v ":latest" \
              | sort -k2,3 -r \
              | tail -n +$((KEEP + 1)) \
              | awk "{print \$1}" \
              | grep -v "^${LATEST_ID}$" \
              | xargs -r sudo podman rmi -f > /dev/null 2>&1 || true

            echo "✅ 蓝绿部署完成（active=$STANDBY_PORT，standby=$ACTIVE_PORT 都跑 :latest）"
          '

      - name: Cleanup local artifacts
        if: always()
        run: rm -rf ./artifacts /tmp/pstep-gateway.tar.gz
