# ============================================================================
# Pstep Gateway — 自动部署工作流（前后端 + 容器化镜像）
#
# 触发方式：
#   1. push 到 main 分支（src/frontend/Cargo/Containerfile/quadlet 等）
#   2. 手动触发 (workflow_dispatch)
#
# 设计：
#   - 后端构建为 Podman Quadlet 镜像；前端仍由主机 nginx 静态托管
#   - 镜像推到 GHCR (ghcr.io/<owner>/pstep-gateway)，服务器 `podman pull` 拉取
#   - GHCR 包设为 public，服务器免密拉取
#   - 服务器保留最近 5 个镜像版本，实现原子回滚
#   - gateway 构建内联到 deploy job，避免 10 MB artifact 下载的 GH Actions
#     偶发失败问题。frontend 仍并行构建（artifact 仅 90 KB，稳定）
# ============================================================================

name: 🚀 Deploy Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'Containerfile'
      - '.containerignore'
      - 'quadlet/**'
      - '.github/workflows/deploy.yml'

jobs:
  # ==========================================================================
  # 1. 前端构建：dist 由主机 nginx 静态托管（并行执行）
  # ==========================================================================
  build-admin:
    name: 🎨 Build Admin Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - working-directory: ./frontend
        run: npm ci

      - working-directory: ./frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/dist
          retention-days: 3

  # ==========================================================================
  # 2. 构建 + 推 GHCR + 远程部署
  # ==========================================================================
  deploy:
    name: 🚀 Build Gateway & Deploy
    needs: [build-admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push 需要
    steps:
      - uses: actions/checkout@v6

      - name: Download admin dist artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./artifacts/admin-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gateway image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pstep-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 让服务器可以匿名拉取（首次 push 后包自动创建为 private，这里改 public）
          # 失败不影响本次部署（可手动在 GitHub Packages UI 改 public 后重跑）
          status=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/pstep-gateway" \
            -d '{"visibility":"public"}')
          if [ "$status" = "200" ]; then
            echo "✅ GHCR package set to public"
          else
            echo "⚠️  visibility API returned $status（继续部署；如需匿名拉取请手动在 GitHub UI 改 public）"
          fi

      - name: Deploy via SSH
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -euo pipefail

          # ---- 配置 SSH ----
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSHD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"
          SSHCMD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key"
          SCP="scp -i ~/.ssh/deploy_key"

          # ---- 1. 部署前端（主机 nginx 静态服务）----
          echo "📦 部署前端 dist..."
          rsync -az --delete \
            -e "$SSHCMD" \
            ./artifacts/admin-dist/ \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/admin-dist/

          $SSHD '
            set -e
            sudo mkdir -p /opt/pstep/admin
            sudo rsync -a --delete /tmp/admin-dist/ /opt/pstep/admin/dist/
            rm -rf /tmp/admin-dist
            echo "✅ 前端 dist 已部署"
          '

          # ---- 2. 推送 Quadlet 单元文件 ----
          echo "📜 推送 Quadlet..."
          $SCP quadlet/pstep-gateway.container \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/pstep-gateway.container
          $SSHD '
            set -e
            sudo mkdir -p /etc/containers/systemd/pstep
            sudo install -m 0644 /tmp/pstep-gateway.container \
              /etc/containers/systemd/pstep/pstep-gateway.container
            rm -f /tmp/pstep-gateway.container
            sudo systemctl daemon-reload
          '

          # ---- 2.5 准备运行时目录（idempotent）----
          # config.yaml 需世界可读（distroless 以 UID 65532 运行，无 /etc/passwd 项）
          # /var/lib/pstep-gateway 需 chown 65532 让 usage_db 能写
          echo "🔧 准备运行时目录..."
          $SSHD '
            set -e
            if [ -f /etc/pstep-gateway/config.yaml ]; then
              sudo chmod 644 /etc/pstep-gateway/config.yaml
            fi
            sudo mkdir -p /var/lib/pstep-gateway
            sudo chown 65532:65532 /var/lib/pstep-gateway
            sudo chmod 755 /var/lib/pstep-gateway
          '

          # ---- 3. 服务器端：pull + restart + 健康检查 + 镜像保留 ----
          $SSHD "
            set -e

            echo \"📥 pull 新镜像 from GHCR...\"
            sudo podman pull ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }}
            sudo podman tag  ghcr.io/${{ github.repository_owner }}/pstep-gateway:${{ github.sha }} \
                             ghcr.io/${{ github.repository_owner }}/pstep-gateway:latest

            echo \"🔄 重启 pstep-gateway（容器化）...\"
            sudo systemctl restart pstep-gateway.service

            echo \"🏥 健康检查（重试 6 次，每次间隔 5s）...\"
            healthy=false
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:3002/health > /dev/null; then
                echo \"✅ Gateway healthy (attempt \$i)\"
                healthy=true
                break
              fi
              echo \"⏳ attempt \$i failed, retrying in 5s...\"
              sleep 5
            done

            if [ \"\$healthy\" != \"true\" ]; then
              echo \"❌ Health check failed after 30s\"
              echo \"---- journalctl tail ----\"
              sudo journalctl -u pstep-gateway.service --no-pager -n 80 || true
              exit 1
            fi

            echo \"🌐 验证前端可访问...\"
            if ! curl -sf http://127.0.0.1:3003/ > /dev/null; then
              echo \"❌ Frontend check failed\"
              exit 1
            fi
            echo \"✅ Frontend reachable\"

            # ---- 4. 镜像保留策略：保留最近 5 个版本 ----
            echo \"🧹 清理旧镜像（保留最近 5 个）...\"
            KEEP=5
            sudo podman images --format '{{.ID}} {{.CreatedAt}} {{.Repository}}:{{.Tag}}' \
              | grep 'ghcr.io/${{ github.repository_owner }}/pstep-gateway' \
              | grep -v ':latest' \
              | sort -k2,3 -r \
              | tail -n +\$((KEEP + 1)) \
              | awk '{print \$1}' \
              | xargs -r sudo podman rmi -f > /dev/null 2>&1 || true

            # 清理 scp 时代遗留的本地 pstep-gateway:* 镜像（无 ghcr.io 前缀）
            sudo podman images --format '{{.ID}} {{.Repository}}' \
              | awk '\$2 == \"pstep-gateway\" || \$2 == \"localhost/pstep-gateway\" {print \$1}' \
              | xargs -r sudo podman rmi -f > /dev/null 2>&1 || true

            echo \"✅ 部署完成\"
          "

      - name: Cleanup local artifacts
        if: always()
        run: rm -rf ./artifacts
