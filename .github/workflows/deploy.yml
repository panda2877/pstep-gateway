# ============================================================================
# Pstep Gateway — 自动部署工作流（前后端 + 容器化镜像）
#
# 触发方式：
#   1. push 到 main 分支（src/frontend/Cargo/Containerfile/quadlet 等）
#   2. 手动触发 (workflow_dispatch)
#
# 设计：
#   - 后端构建为 Podman Quadlet 镜像；前端仍由主机 nginx 静态托管
#   - 镜像不走 registry，由 CI 直接 scp 到服务器、podman load
#   - 服务器保留最近 5 个镜像版本，实现原子回滚
#   - gateway 构建内联到 deploy job，避免 10 MB artifact 下载的 GH Actions
#     偶发失败问题。frontend 仍并行构建（artifact 仅 90 KB，稳定）
# ============================================================================

name: 🚀 Deploy Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'Containerfile'
      - '.containerignore'
      - 'quadlet/**'
      - '.github/workflows/deploy.yml'

jobs:
  # ==========================================================================
  # 1. 前端构建：dist 由主机 nginx 静态托管（并行执行）
  # ==========================================================================
  build-admin:
    name: 🎨 Build Admin Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - working-directory: ./frontend
        run: npm ci

      - working-directory: ./frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: frontend/dist
          retention-days: 3

  # ==========================================================================
  # 2. 构建 + 部署到服务器
  #    gateway 镜像构建内联在此 job，使用 buildx GHA cache（命中时 ~30s）
  # ==========================================================================
  deploy:
    name: 🚀 Build Gateway & Deploy
    needs: [build-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download admin dist artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ./artifacts/admin-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: pstep-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar.gz
        run: |
          docker save pstep-gateway:${{ github.sha }} > /tmp/pstep-gateway.tar
          gzip -1 /tmp/pstep-gateway.tar
          ls -lh /tmp/pstep-gateway.tar.gz

      - name: Deploy via SSH
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -euo pipefail

          # ---- 配置 SSH ----
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSHD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"
          SCP="scp -i ~/.ssh/deploy_key"

          # ---- 1. 部署前端（主机 nginx 静态服务）----
          echo "📦 部署前端 dist..."
          rsync -az --delete \
            -e "$SCP" \
            ./artifacts/admin-dist/ \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/admin-dist/

          $SSHD '
            set -e
            sudo mkdir -p /opt/pstep/admin
            sudo rsync -a --delete /tmp/admin-dist/ /opt/pstep/admin/dist/
            rm -rf /tmp/admin-dist
            echo "✅ 前端 dist 已部署"
          '

          # ---- 2. 推送 Quadlet 单元文件 ----
          echo "📜 推送 Quadlet..."
          $SCP quadlet/pstep-gateway.container \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/pstep-gateway.container
          $SSHD '
            set -e
            sudo mkdir -p /etc/containers/systemd/pstep
            sudo install -m 0644 /tmp/pstep-gateway.container \
              /etc/containers/systemd/pstep/pstep-gateway.container
            rm -f /tmp/pstep-gateway.container
            sudo systemctl daemon-reload
          '

          # ---- 3. 直传镜像 ----
          echo "🐳 直传 gateway 镜像..."
          $SCP /tmp/pstep-gateway.tar.gz \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/pstep-gateway.tar.gz

          # ---- 4. 服务器端：load + restart + 健康检查 + 镜像保留 ----
          $SSHD '
            set -e

            echo "📥 load 新镜像..."
            gunzip -f /tmp/pstep-gateway.tar.gz
            sudo podman load -i /tmp/pstep-gateway.tar
            sudo podman tag pstep-gateway:${{ github.sha }} pstep-gateway:latest
            rm -f /tmp/pstep-gateway.tar

            echo "🔄 重启 pstep-gateway（容器化）..."
            sudo systemctl restart pstep-gateway.service

            echo "🏥 健康检查（重试 6 次，每次间隔 5s）..."
            healthy=false
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:3002/health > /dev/null; then
                echo "✅ Gateway healthy (attempt $i)"
                healthy=true
                break
              fi
              echo "⏳ attempt $i failed, retrying in 5s..."
              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              echo "❌ Health check failed after 30s"
              echo "---- journalctl tail ----"
              sudo journalctl -u pstep-gateway.service --no-pager -n 80 || true
              exit 1
            fi

            echo "🌐 验证前端可访问..."
            if ! curl -sf http://127.0.0.1:3003/ > /dev/null; then
              echo "❌ Frontend check failed"
              exit 1
            fi
            echo "✅ Frontend reachable"

            # ---- 5. 镜像保留策略：保留最近 5 个版本 ----
            echo "🧹 清理旧镜像（保留最近 5 个）..."
            KEEP=5
            sudo podman images --format "{{.ID}} {{.CreatedAt}} {{.Repository}}:{{.Tag}}" \
              | grep "pstep-gateway" \
              | grep -v ":latest" \
              | sort -k2,3 -r \
              | tail -n +$((KEEP + 1)) \
              | awk "{print \$1}" \
              | xargs -r sudo podman rmi -f > /dev/null 2>&1 || true

            echo "✅ 部署完成"
          '

      - name: Cleanup local artifacts
        if: always()
        run: rm -rf ./artifacts /tmp/pstep-gateway.tar.gz