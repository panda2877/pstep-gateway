# ============================================================================
# Pstep Gateway — Rust 版自动部署工作流
# 触发方式：
#   1. 手动触发 (workflow_dispatch)
#   2. push 到 main 分支时自动触发
# ============================================================================

name: 🚀 Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.1.0)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Build & Deploy Gateway
    runs-on: ubuntu-latest

    steps:
      - name: 🔨 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: 📦 Build Release
        run: cargo build --release

      - name: 📤 Copy Binary
        run: cp target/release/pstep-gateway ./gateway-bin

      - name: 🚀 Deploy to server
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -e

          # 配置 SSH
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSHD="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"

          echo '停止 gateway 服务...'
          $SSHD 'sudo systemctl stop pstep-gateway || true'

          echo '备份...'
          TS=$(date +%Y%m%d_%H%M%S)
          $SSHD "if [ -d /opt/pstep/gateway ]; then sudo mkdir -p /opt/pstep/backups/\${TS} && sudo cp -r /opt/pstep/gateway /opt/pstep/backups/\${TS}/; fi"

          echo '部署 gateway...'
          $SSHD 'sudo mkdir -p /opt/pstep/gateway'
          cat ./gateway-bin | $SSHD 'sudo tee /opt/pstep/gateway/pstep-gateway > /dev/null'
          $SSHD 'sudo chmod +x /opt/pstep/gateway/pstep-gateway'

          # 如果有配置文件需要更新
          $SSHD 'if [ -f /opt/pstep/gateway/config.yaml ]; then sudo cp /opt/pstep/gateway/config.yaml /opt/pstep/gateway/config.yaml.new || true; fi'

          echo '启动 gateway...'
          $SSHD 'sudo systemctl start pstep-gateway'

          echo '健康检查...'
          sleep 3
          $SSHD '
            echo "=== Gateway Status ==="
            sudo systemctl is-active pstep-gateway
            echo "=== Health Check ==="
            curl -s http://localhost:3001/health || echo "health endpoint not available"
            echo ""
          '

          echo '✅ Gateway 部署完成!'
